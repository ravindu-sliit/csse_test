version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: dmc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dmc_db
    ports:
      - "5432:5432"
    volumes:
      - dmc_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dmc_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dmc.lk
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  dmc_postgres_data: